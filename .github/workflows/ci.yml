name: ci
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml "mcp>=1.2,<2"
      - run: python3 tools/lint_skills.py
      - run: python3 -m unittest discover -s evals/tests -t .
